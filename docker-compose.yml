version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    restart: unless-stopped
    networks:
      - mern_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    # KHÔNG expose port ra ngoài - Nginx sẽ làm cổng vào duy nhất
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - mern_network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    # KHÔNG expose port ra ngoài - Nginx sẽ làm cổng vào duy nhất
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - mern_network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"    # Cổng duy nhất ra internet
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - admin
      - server
    restart: unless-stopped
    networks:
      - mern_network

networks:
  mern_network:
    driver: bridge
