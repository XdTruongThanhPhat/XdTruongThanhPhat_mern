events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Gzip compression - Tối ưu đầy đủ
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        application/vnd.ms-fontobject
        font/ttf
        font/opentype
        font/woff
        font/woff2
        image/svg+xml;

    # Upstream backends (tên phải khớp với tên service trong docker-compose.yml)
    upstream client_app {
        server client:80;
    }

    upstream admin_app {
        server admin:80;
    }

    upstream api_server {
        server server:5000;
    }

    # =============================================
    # SERVER CHÍNH: client app (truongthanhphatdn.vn)
    # =============================================
    server {
        listen 80;
        server_name truongthanhphatdn.vn www.truongthanhphatdn.vn;

        # Security Headers - Cải thiện SEO + bảo mật
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Proxy API requests đến Express server
        location /api/ {
            proxy_pass http://api_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
            
            # Upload file size limit (cho phép upload ảnh lớn)
            client_max_body_size 50M;
        }

        # Proxy sitemap.xml to express API sitemap route
        location = /sitemap.xml {
            proxy_pass http://api_server/api/sitemap.xml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Cache static assets (JS, CSS, images, fonts) - 1 năm
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|avif)$ {
            proxy_pass http://client_app;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Proxy React client app
        location / {
            proxy_pass http://client_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # =============================================
    # SERVER ADMIN: admin panel (admin.truongthanhphatdn.vn)
    # =============================================
    server {
        listen 80;
        server_name admin.truongthanhphatdn.vn;

        # Proxy API requests đến Express server
        location /api/ {
            proxy_pass http://api_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            
            client_max_body_size 50M;
        }

        # Proxy React admin app
        location / {
            proxy_pass http://admin_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
