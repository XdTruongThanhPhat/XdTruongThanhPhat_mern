events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Upstream backends (tên phải khớp với tên service trong docker-compose.yml)
    upstream client_app {
        server client:80;
    }

    upstream admin_app {
        server admin:80;
    }

    upstream api_server {
        server server:5000;
    }

    # =============================================
    # SERVER CHÍNH: client app (hoangitk.io.vn)
    # =============================================
    server {
        listen 80;
        server_name hoangitk.io.vn www.hoangitk.io.vn;

        # Proxy API requests đến Express server
        location /api/ {
            proxy_pass http://api_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
            
            # Upload file size limit (cho phép upload ảnh lớn)
            client_max_body_size 50M;
        }

        # Proxy React client app
        location / {
            proxy_pass http://client_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # =============================================
    # SERVER ADMIN: admin panel (admin.hoangitk.io.vn)
    # =============================================
    server {
        listen 80;
        server_name admin.hoangitk.io.vn;

        # Proxy API requests đến Express server
        location /api/ {
            proxy_pass http://api_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            
            client_max_body_size 50M;
        }

        # Proxy React admin app
        location / {
            proxy_pass http://admin_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
