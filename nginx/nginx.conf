events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Giới hạn upload toàn cục (mặc định Nginx chỉ 1MB → gây lỗi 413)
    client_max_body_size 50M;

    # Proxy cache cho API responses (5 phút, tối đa 100MB)
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=5m;

    # ==============================================
    # SEO: Detect Search Engine Bots từ User-Agent
    # Khi bot crawl trang động → proxy đến SSR route
    # ==============================================
    map $http_user_agent $is_bot {
        default                 0;
        ~*Googlebot             1;
        ~*"Google-InspectionTool" 1;
        ~*"Googlebot-Image"     1;
        ~*"Storebot-Google"     1;
        ~*"Google-Extended"     1;
        ~*bingbot               1;
        ~*Baiduspider           1;
        ~*YandexBot             1;
        ~*DuckDuckBot           1;
        ~*Slurp                 1;
        ~*facebookexternalhit   1;
        ~*Twitterbot            1;
        ~*LinkedInBot           1;
    }

    # Gzip compression - Tối ưu đầy đủ
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        application/vnd.ms-fontobject
        font/ttf
        font/opentype
        font/woff
        font/woff2
        image/svg+xml;

    # Upstream backends (tên phải khớp với tên service trong docker-compose.yml)
    upstream client_app {
        server client:80;
    }

    upstream admin_app {
        server admin:80;
    }

    upstream api_server {
        server server:5000;
    }

    # =============================================
    # SEO FIX 1: Redirect www → non-www
    # Google Search Console: Tránh trùng lặp URL
    # =============================================
    # Xác định protocol thực tế từ Cloudflare (HTTPS) hoặc fallback $scheme
    map $http_x_forwarded_proto $real_scheme {
        default $scheme;
        https   https;
        http    http;
    }

    server {
        listen 80;
        server_name www.truongthanhphatdn.vn;

        # Redirect vĩnh viễn tất cả request từ www sang non-www
        # Dùng $real_scheme từ Cloudflare để tránh redirect loop
        return 301 $real_scheme://truongthanhphatdn.vn$request_uri;
    }

    # =============================================
    # SERVER CHÍNH: client app (truongthanhphatdn.vn)
    # =============================================
    server {
        listen 80;
        server_name truongthanhphatdn.vn;

        # =============================================
        # SEO FIX: Đảm bảo mọi response đều có charset UTF-8
        # Ngăn Googlebot nhận ký tự rác khi crawl trang động
        # =============================================
        charset utf-8;
        charset_types text/html text/plain text/xml application/xml application/json;

        # Security Headers - Cải thiện SEO + bảo mật
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # =============================================
        # SEO FIX 2: Chuẩn hóa trailing slash
        # /bao-gia/ → /bao-gia (301 redirect)
        # Tránh Google coi 2 URL là 2 trang khác nhau
        # =============================================
        # Chỉ redirect URL có trailing slash (trừ root "/")
        # Dùng rewrite thay vì location để bắt tất cả URL
        if ($request_uri ~ "^(.+)/$") {
            return 301 $1;
        }

        # =============================================
        # SEO: Proxy sitemap.xml → API Server (KHÔNG CACHE)
        # Google cần thấy sitemap mới nhất mỗi lần crawl
        # =============================================
        location = /sitemap.xml {
            proxy_pass http://api_server/api/sitemap.xml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # Không cache sitemap - Google phải luôn nhận bản mới nhất
            proxy_cache off;
            add_header Cache-Control "public, max-age=600";
            # ĐÃ XÓA X-Robots-Tag "noindex" — header này khiến Google
            # từ chối tìm nạp sitemap (44 URL bị ảnh hưởng trên GSC)
        }

        # =============================================
        # SEO: Proxy robots.txt → API Server
        # Đảm bảo robots.txt luôn trỏ đúng sitemap URL
        # =============================================
        location = /robots.txt {
            proxy_pass http://api_server/api/robots.txt;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            proxy_cache off;
            add_header Cache-Control "public, max-age=86400";
        }

        # =============================================
        # SEO SSR: Trang chi tiết Tin tức (Dynamic)
        # Bot crawlers → nhận HTML đầy đủ từ API server
        # User thường → nhận React SPA như bình thường
        # =============================================
        location ~ ^/tin-tuc/(.+)$ {
            # Proxy headers - ĐẶT TRƯỚC if block để áp dụng cho MỌI request
            # (bao gồm cả bot proxy, tránh lỗi encoding tiếng Việt)
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";

            # Nếu là bot → proxy đến SSR route trên API server
            if ($is_bot) {
                rewrite ^/tin-tuc/(.+)$ /api/ssr/tin-tuc/$1 break;
                proxy_pass http://api_server;
            }

            # User thường → serve React SPA
            proxy_pass http://client_app;
        }

        # =============================================
        # SEO SSR: Trang chi tiết Dự án (Dynamic)
        # Bot crawlers → nhận HTML đầy đủ từ API server
        # User thường → nhận React SPA như bình thường
        # =============================================
        location ~ ^/hang-muc/cong-trinh-chi-tiet/(.+)$ {
            # Proxy headers - ĐẶT TRƯỚC if block để áp dụng cho MỌI request
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";

            # Nếu là bot → proxy đến SSR route trên API server
            if ($is_bot) {
                rewrite ^/hang-muc/cong-trinh-chi-tiet/(.+)$ /api/ssr/hang-muc/cong-trinh-chi-tiet/$1 break;
                proxy_pass http://api_server;
            }

            # User thường → serve React SPA
            proxy_pass http://client_app;
        }

        # =============================================
        # SEO SSR: Trang chi tiết Video (Dynamic)
        # =============================================
        location ~ ^/video/(.+)$ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";

            if ($is_bot) {
                rewrite ^/video/(.+)$ /api/ssr/video/$1 break;
                proxy_pass http://api_server;
            }

            proxy_pass http://client_app;
        }

        # Proxy API requests đến Express server
        location /api/ {
            proxy_pass http://api_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
            
            # Upload file size limit (cho phép upload ảnh lớn)
            client_max_body_size 50M;

            # Cache GET API responses 5 phút
            proxy_cache api_cache;
            proxy_cache_methods GET;
            proxy_cache_valid 200 5m;
            proxy_cache_key "$request_uri";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Cache static assets (JS, CSS, images, fonts) - 1 năm
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|avif)$ {
            proxy_pass http://client_app;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Proxy React client app
        location / {
            proxy_pass http://client_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # =============================================
    # SERVER ADMIN: admin panel (admin.truongthanhphatdn.vn)
    # =============================================
    server {
        listen 80;
        server_name admin.truongthanhphatdn.vn;

        # Proxy API requests đến Express server
        location /api/ {
            proxy_pass http://api_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
            
            client_max_body_size 50M;

            # Timeout cho upload ảnh (Cloudinary xử lý tuần tự, cần thời gian)
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Buffer size cho request lớn
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Proxy React admin app
        location / {
            proxy_pass http://admin_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
