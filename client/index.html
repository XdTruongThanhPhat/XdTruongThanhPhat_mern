<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- Đã sửa type icon cho đúng định dạng PNG -->
    <link rel="icon" type="image/png" href="/Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Theme Color cho thanh trình duyệt trên mobile -->
    <meta name="theme-color" content="#16a34a" />

    <!-- Preconnect: Tăng tốc tải font và ảnh từ bên ngoài -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- SEO Căn bản -->
    <title>TRƯỜNG THÀNH PHÁT</title>
    <meta name="description" content="Công ty Trường Thành Phát chuyên tư vấn thiết kế kiến trúc, thi công xây dựng và hoàn thiện nội thất chuyên nghiệp tại Đà Nẵng." />
    <meta name="keywords" content="thiết kế nhà, xây dựng nhà phố, biệt thự Đà Nẵng, nội thất, kiến trúc sư, thi công xây dựng, Trường Thành Phát, xây nhà trọn gói Đà Nẵng" />
    <meta name="author" content="Xuân Hoàng" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (Tối ưu hiển thị khi share link Zalo, Facebook) -->
    <meta property="og:title" content="Trường Thành Phát - Thiết kế & Xây dựng tại Đà Nẵng" />
    <meta property="og:description" content="Đơn vị thiết kế và thi công xây dựng nhà phố, biệt thự, nội thất uy tín tại Đà Nẵng." />
    <meta property="og:image" content="https://truongthanhphatdn.vn/Logo.png" />
    <meta property="og:url" content="https://truongthanhphatdn.vn/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:site_name" content="Trường Thành Phát" />

    <!-- Twitter Card (Tối ưu hiển thị khi share trên Twitter/X) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trường Thành Phát - Thiết kế & Xây dựng tại Đà Nẵng" />

    <meta name="twitter:image" content="https://truongthanhphatdn.vn/Logo.png" />
