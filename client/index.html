<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- Đã sửa type icon cho đúng định dạng PNG -->
    <link rel="icon" type="image/png" href="/Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Theme Color cho thanh trình duyệt trên mobile -->
    <meta name="theme-color" content="#16a34a" />

    <!-- Preconnect: Tăng tốc tải font và ảnh từ bên ngoài -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!--
      SEO FIX: KHÔNG đặt meta OG, Twitter, description, keywords ở đây!
      LÝ DO: Puppeteer prerender sẽ GHI CHỒNG thêm meta từ React Helmet
      → tạo 2 thẻ <title>, 2 thẻ description → Google coi là trùng lặp
      → 30 trang bị "Trang thay thế có thể chính tắc thích hợp" trên GSC.
      
      Mỗi trang React đã tự quản lý đầy đủ SEO meta qua <Helmet>.
      Chỉ giữ <title> fallback ngắn cho lần tải đầu tiên (trước khi JS render).
    -->
    <title>Trường Thành Phát</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
